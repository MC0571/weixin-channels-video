<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>视频号分享链接解析</title>
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./agent.js"></script>
  </head>
  <body>
    <main class="shell">
      <header class="page-header">
        <div class="page-title-row">
          <h1>解析视频号分享链接</h1>
          <button
            id="ai-download-prompt-open"
            class="secondary-button ai-prompt-launch"
            type="button"
            aria-haspopup="dialog"
            aria-controls="ai-download-prompt-popover"
            aria-expanded="false"
            popovertarget="ai-download-prompt-popover"
          >
            <img src="./icons/terminal.svg" alt="" aria-hidden="true">
            <span>Agent 设置</span>
          </button>
        </div>
        <p class="intro">粘贴公开分享链接，解析后预览并保存视频。</p>
      </header>

      <div
        id="ai-download-prompt-popover"
        class="ai-prompt-popover"
        popover="auto"
        role="dialog"
        aria-modal="false"
        aria-labelledby="ai-prompt-heading"
        aria-describedby="ai-prompt-description"
      >
        <div class="ai-prompt-heading-row">
          <h2 id="ai-prompt-heading">Agent 设置</h2>
          <div class="ai-agent-icons" role="group" aria-label="Agent 图标">
            <img src="./icons/agents/codex.png" alt="Codex" title="Codex" width="24" height="24">
            <img src="./icons/agents/claude-code.png" alt="Claude Code" title="Claude Code" width="24" height="24">
            <img src="./icons/agents/workbuddy.svg" alt="WorkBuddy" title="WorkBuddy" width="24" height="24">
            <img src="./icons/agents/doubao-work.png" alt="豆包工作" title="豆包工作" width="24" height="24">
            <img src="./icons/agents/qwen-work.png" alt="千问办公（QwenWork）" title="千问办公（QwenWork）" width="24" height="24">
            <img src="./icons/agents/trae.png" alt="Trae" title="Trae" width="24" height="24">
          </div>
        </div>
        <p id="ai-prompt-description" class="visually-hidden">
          检查完整提示词后，可复制并粘贴给 Agent；此面板不会自动执行下载。
        </p>
        <p id="bridge-connection-status" class="status bridge-connection-status" role="status" aria-live="polite" hidden></p>
        <textarea id="ai-download-prompt-text" rows="12" readonly aria-label="提示词全文"></textarea>
        <p id="ai-prompt-copy-status" class="status ai-prompt-copy-status" role="status" aria-live="polite"></p>
        <button id="ai-download-prompt-copy" class="ai-prompt-copy" type="button">
          <img src="./icons/copy.svg" alt="" aria-hidden="true">
          <span>复制提示词</span>
        </button>
      </div>

      <section class="card input-card" aria-label="解析视频号分享链接">
        <form id="parse-form">
          <label class="visually-hidden" for="share-url">视频号分享链接</label>
          <div class="form-row">
            <input
              id="share-url"
              name="url"
              type="url"
              inputmode="url"
              autocomplete="url"
              autocorrect="off"
              autocapitalize="off"
              spellcheck="false"
              placeholder="https://weixin.qq.com/sph/..."
              required
            >
            <button id="parse-button" class="primary-button" type="submit">解析视频</button>
          </div>
        </form>
        <p id="parse-status" class="status" role="status" aria-live="polite"></p>
        <div class="input-notes">
          <p class="privacy-note">
            点击解析后，链接会发送至腾讯元宝并向视频号获取视频信息；浏览器使用当前元宝登录态。
            <a href="https://github.com/MC0571/weixin-channels-video/blob/main/PRIVACY.md" target="_blank" rel="noreferrer">隐私政策</a>
          </p>
          <p class="login-note">
            需要在此 Chrome profile 中登录腾讯元宝，登录信息保留在浏览器内。
            <a href="https://yuanbao.tencent.com/" target="_blank" rel="noreferrer">打开元宝登录</a>
          </p>
        </div>
      </section>

      <section id="result-card" class="card result-card" aria-labelledby="result-heading" hidden>
        <div class="result-heading">
          <h2 id="result-heading">视频信息</h2>
          <button id="download-button" class="primary-button" type="button" disabled>下载视频</button>
        </div>
        <div class="result-grid">
          <div class="media-column">
            <video id="preview-video" controls preload="metadata"></video>
            <section class="media-variants-panel" aria-labelledby="media-variants-heading">
              <h3 id="media-variants-heading">下载视频版本</h3>
              <ul id="media-variants" class="media-variants" aria-label="可下载视频版本"></ul>
            </section>
          </div>
          <aside class="result-details">
            <dl class="metadata">
              <div>
                <dt>标题</dt>
                <dd id="video-title"></dd>
              </div>
              <div>
                <dt>作者</dt>
                <dd id="video-author"></dd>
              </div>
            </dl>
            <img id="cover-image" class="cover-image" alt="视频封面" hidden>
          </aside>
        </div>
      </section>

      <section class="card download-card" aria-labelledby="download-heading">
        <h2 id="download-heading">下载状态</h2>
        <p id="download-status" class="status" role="status" aria-live="polite">下载进度会显示在这里。</p>
      </section>
    </main>
  </body>
</html>
